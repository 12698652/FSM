; 食品腐败智能检测系统 - ESP32-S3 固件项目
;   环境 esp32s3: 主固件(main.cpp)
;   环境 diag:    阶段1硬件联调诊断固件(diag_main.cpp)，无第三方库，编译更快
;
; 常用命令:
;   编译主固件: pio run
;   编译诊断:   pio run -e diag
;   烧录诊断:   pio run -e diag -t upload
;   看串口:     pio run -e diag -t monitor

; 微雪 ESP32-S3-Nano 实际模组为 ESP32-S3R8：16MB Flash + 8MB Octal PSRAM(OPI)
; 默认 board=esp32-s3-devkitc-1 是 N8(8MB)/No PSRAM，必须显式覆盖，否则 PSRAM 不被识别
[env]
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; 本板只有原生 USB(USB-Serial/JTAG)，没有 CH340 之类的 USB 转串口芯片。
; arduino-esp32 默认把 Serial 指向 UART0(GPIO43/44)，而 UART0 在本板上没有引出，
; 所以必须显式把 Serial 重定向到硬件 USB(JTAG/CDC)，否则串口监视器永远收不到 print。
;   ARDUINO_USB_MODE=1        用硬件 USB-Serial/JTAG(不是 TinyUSB)
;   ARDUINO_USB_CDC_ON_BOOT=1 把 Serial 指向 USB，而不是 UART0
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; 本板用原生 USB(USB-Serial/JTAG)：串口监视器打开时若拉高 RTS/DTR，
; 会被 USB-Serial/JTAG 外设当成复位信号，导致"连上又掉线"死循环
; (ClearCommError / 设备不识别此命令)。按乐鑫官方文档禁用这两根控制线。
; 注意：这两个选项只有在按环境启动监视器时才生效，
;      即 pio run -e diag -t monitor 或 pio device monitor -e diag，
;      直接 pio device monitor -p COM3 不会读取 platformio.ini。
monitor_rts = 0
monitor_dtr = 0

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit BME680 Library
	adafruit/Adafruit SGP30 Sensor
	knolleary/PubSubClient
	bblanchon/ArduinoJson@^6.21.5
	adafruit/Adafruit SSD1306
	adafruit/Adafruit GFX Library
	tzapu/WiFiManager@^2.0.17
build_src_filter =
	+<*.cpp>
	-<diag_main.cpp>

[env:diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter =
	+<*.cpp>
	-<main.cpp>
